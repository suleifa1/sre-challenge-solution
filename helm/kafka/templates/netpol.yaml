{{- if .Values.networkPolicy.enabled }}
---
# first deny all 
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: {{ .Values.namespace }}
spec:
  podSelector: {}
  policyTypes:
  - Ingress
  - Egress
---
# allow only things we want 
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: kafka-ingress
  namespace: {{ .Values.namespace }}
spec:
  podSelector:
    matchLabels:
      app: kafka
  policyTypes:
  - Ingress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: {{ .Values.dependencies.front.namespace }}
      podSelector:
        matchLabels:
          app: front
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: {{ .Values.dependencies.back.namespace }}
      podSelector:
        matchLabels:
          app: back
    - podSelector:
        matchLabels:
          app: kafka-init
    ports:
    - port: {{ .Values.kafka.port }}
      protocol: TCP

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: kafka-init-egress
  namespace: {{ .Values.namespace }}
spec:
  podSelector:
    matchLabels:
      app: kafka-init
  policyTypes:
  - Egress
  egress:
  - ports:
    - port: 53
      protocol: UDP
    - port: 53
      protocol: TCP
  - to:
    - podSelector:
        matchLabels:
          app: kafka
    ports:
    - port: {{ .Values.kafka.port }}   
    
{{- end }}