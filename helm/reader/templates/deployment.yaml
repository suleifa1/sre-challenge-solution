apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.app.name }}
  namespace: {{ .Values.namespace }}
  labels:
    app: {{ .Values.app.name }}
spec:
  replicas: {{ .Values.app.replicaCount }}
  selector:
    matchLabels:
      app: {{ .Values.app.name }}
  template:
    metadata:
      labels:
        app: {{ .Values.app.name }}
    spec:
    {{- if .Values.app.imagePullSecrets }}
      imagePullSecrets:
      {{- toYaml .Values.app.imagePullSecrets | nindent 8 }}
    {{- end }}
      {{- include "app.podSecurityContext" . | nindent 6 }}
      initContainers:
        {{- include "app.waitForPostgres" . | nindent 8 }}
      containers:
      - name: {{ .Values.app.name }}
        image: "{{ .Values.app.image }}"
        imagePullPolicy: {{ .Values.app.imagePullPolicy }}
        {{- include "app.containerSecurityContext" . | nindent 8 }}
        ports:
        - name: http
          containerPort: {{ .Values.app.port }}
        - name: management
          containerPort: {{ .Values.app.managementPort }}

        env:
        - name: SPRING_DATASOURCE_USERNAME
          valueFrom:
            secretKeyRef:
              name: db-credentials
              key: username
        - name: SPRING_DATASOURCE_PASSWORD
          valueFrom:
            secretKeyRef:
              name: db-credentials
              key: password

        volumeMounts:
        - name: config
          mountPath: /config
          readOnly: true
        - name: tmp 
          mountPath: /tmp

        startupProbe:
          httpGet:
            path: /health
            port: management
          failureThreshold: 30
          periodSeconds: 15

        livenessProbe:
          httpGet:
            path: /health
            port: management
          periodSeconds: 10
          failureThreshold: 3

        readinessProbe:
          httpGet:
            path: /health
            port: management
          periodSeconds: 5
          failureThreshold: 3

        resources:
          requests:
            cpu: {{ .Values.app.resources.requests.cpu }}
            memory: {{ .Values.app.resources.requests.memory }}
          limits:
            cpu: {{ .Values.app.resources.limits.cpu }}
            memory: {{ .Values.app.resources.limits.memory }}

        args:
        - "--spring.config.additional-location=file:///config/application.yaml"

      volumes:
      - name: config
        configMap:
          name: {{ .Values.app.name }}-config
      - name: tmp
        emptyDir: {}
